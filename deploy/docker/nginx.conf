# PRDwright 站点配置：一个入口，三路请求
#
#   1) `/`        用户端静态产物（站点根）
#   2) `/admin/`  管理端静态产物（站点根的 admin/ 子目录；管理端 vite base = `/admin/`）
#   3) `/api/`    反代到 `api:8000`（含流式 SSE）
#
# 容器内落点：`/etc/nginx/conf.d/default.conf`（由 `deploy/docker/web.Dockerfile` 拷入）。
# 站点根：`/usr/share/nginx/html`，两份 dist 的铺法见 Dockerfile。
#
# 为什么只有一个入口、不分子域：两个前端都走同源相对路径（axios `baseURL: '/'`，
# 没有 VITE_API_BASE），Cookie 也下发在同一个 API 域上。同源时 CORS 根本不参与判定，
# 两个前端的登录态天然互通；拆子域就把「Cookie 是 host-only」这件事变成一个新的故障源。
#
# SSE 的三行配置（见下方 `/api/` 段）来自 v7 的约定，缺一行都会让分章生成变成
# 「转圈很久 → 整篇一次性刷出」。

# 上游用「变量 + resolver」，不用 upstream 块：
# upstream 块在 **nginx 启动时** 解析 api，api 还没上网络就是「host not found in upstream」→
# 站点容器直接起不来并进入重启循环。变量形式改成 **每个请求** 解析（Docker 内嵌 DNS 127.0.0.11，
# 由 compose 的自定义网络提供），换来两件事：api 晚起不影响站点在线；api 容器重建换了 IP
# 也不必 reload nginx。
# 代价是拿不到 upstream keepalive（每请求新建一条连接）。单机单用户的本地平台，这个代价可以接受。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 绝不返回目录列表：`/`、`/admin/` 一律落到各自的 index.html。
    # 路径写错时宁可是 404，也不要把容器里的文件系统摊给访问者看。
    autoindex off;

    # 重定向只发相对路径（`Location: /admin/`），不拼 `http://$host/...`：
    # 拼绝对 URL 会丢掉端口（`$host` 不含端口），宿主换了映射端口时 301 会指到错的地方；
    # 也避免 nginx 在反代后面自己猜 scheme。
    absolute_redirect off;

    # gzip 只给静态资源用；`/api/` 段里再显式关掉（压缩会重新引入缓冲）。
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 需求描述 / 粘贴的接口文档可能不小，默认 1m 会给出 413
    client_max_body_size 10m;

    # ------------------------------------------------------------------
    # 1) 用户端（`/`）
    # ------------------------------------------------------------------
    # 首页与 index.html 本体都不许缓存（理由见下面 `location = /index.html`）。
    # 这里单独配一条，是因为 nginx 的 `try_files` 有两个「就地提供文件」的写法
    # （`$uri/` 命中目录、非末尾参数的 `.../index.html`），它们会在**当前 location** 里
    # 把文件发出去，不会重新做 location 匹配 —— 于是 `location = /index.html` 上的头就丢了。
    # 所以这两处一律走 @user_spa，把 no-store 写在真正发出文件的那个块里。
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri @user_spa;
    }

    location @user_spa {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    # index.html 必须 no-store：否则发新版后浏览器还拿着旧 HTML，
    # 去请求已经被替换掉的 hash 资源，表现是「页面能打开、点什么都没反应」。
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # 带 hash 的资源可以长缓存。缺失就是 404，**绝不回落到 index.html**：
    # 回落会让 JS 请求拿到一段 HTML，控制台报 SyntaxError，把真正的原因埋掉。
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ------------------------------------------------------------------
    # 2) 管理端（`/admin/`）
    # ------------------------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    # ⚠️ 这一条的兜底必须是 `/admin/index.html`，不能让它落到站点根的 `/index.html`。
    # 管理端产物挂在子路径下：若 `/admin/dashboard` 拿到用户端的 index.html，
    # 页面里引用的是 `/assets/...`（没有 /admin 前缀），而且用户端路由会把 `/admin/...`
    # 当成自己的路由处理 —— 表现是白屏或跳回用户端首页。
    location = /admin/ {
        try_files /admin/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /admin/ {
        try_files $uri @admin_spa;
    }

    # 管理端 SPA 的兜底出口：与用户端同理，文件在这里发出，no-store 就写在这里
    location @admin_spa {
        try_files /admin/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    # 管理端的 index.html 同样不能被缓存住旧版本。它落在上面的 `^~ /admin/` 之下，
    # 所以要一条精确匹配把 no-store 拿回来（精确匹配优先于 `^~` 前缀匹配）。
    location = /admin/index.html {
        add_header Cache-Control "no-store" always;
    }

    location ^~ /admin/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ------------------------------------------------------------------
    # 3) 接口（`/api/`）
    # ------------------------------------------------------------------
    location ^~ /api/ {
        # 变量形式的 proxy_pass 不带 URI → 原始请求 URI（含查询串）原样转给上游，
        # 所以后端看到的仍然是 `/api/...`，不需要 rewrite 去前缀。
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        # 用 `$http_host`（客户端原样的 Host，含非默认端口）而不是 `$host`（不含端口）：
        # FastAPI 补尾斜杠时发的 307 会拿 Host 拼绝对地址，`$host` 会把端口丢掉，
        # 表现为「改个映射端口就 307 到打不开的地址」。生产 80 端口时两者等价。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ---- SSE：这几行一条都不能省 ----
        # 1) 关响应缓冲。默认开启时 nginx 会把后端一块一块发出的数据攒在内存里，
        #    最后一次性转发，表现为「转圈很久，然后整篇刷出来」，长任务还会在中途超时报错页。
        proxy_buffering off;
        chunked_transfer_encoding on;
        # 2) 长任务的读超时。默认 60 秒：一次生成里只要 60 秒没有新事件就被切断。
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        # 3) gzip 自带缓冲，会把刚关掉的缓冲又加回来。
        gzip off;
        proxy_cache off;

        client_max_body_size 10m;
    }

    # ------------------------------------------------------------------
    # 3.5) 探针（宿主机直达 api，不落到 SPA 兜底）
    # ------------------------------------------------------------------
    # 不加这三条会发生什么：`/readyz` 不在上面的 location 列表里，就落到 `location /` 的
    # SPA 兜底，**返回 200 + index.html**。于是：
    #   - 运维敲 `curl http://<host>/readyz` 看到 200，以为服务就绪，其实拿到一张网页；
    #   - CI 的「轮询就绪探针直到 200」**立刻假绿**（永远第一次就 200）；
    #   - 与架构文档里「宿主机 /healthz、/readyz → api:8000」的拓扑不一致。
    # 三条都用精确匹配（`location =`），优先级最高，不会被 SPA 兜底抢走。
    # 上游同样用变量形式：api 未起时站点仍在，探针自己返回 502，而不是让 nginx 起不来。
    location = /healthz {
        set $api_probe http://api:8000;
        proxy_pass $api_probe;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /readyz {
        set $api_probe http://api:8000;
        proxy_pass $api_probe;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # `/health` 是给人看的三项体检（恒 200），不是探针，但同样需要从宿主可达——
    # 否则排障时会点开一个网页，看不出数据库/模型/技能的真实状态。
    location = /health {
        set $api_probe http://api:8000;
        proxy_pass $api_probe;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ------------------------------------------------------------------
    # 公开的接口文档：一律 404
    # ------------------------------------------------------------------
    # 后端已经关掉了框架默认的这四条（`main.py` 给 FastAPI 传了三个 None），这里是第二道。
    # 结尾必须是 `($|/)` 而不是 `$`：还漏着 `/docs/oauth2-redirect` 这条。
    # `/api/admin/docs`、`/api/admin/redoc` 不在此列 —— 它们以 `/api/` 开头，走上面的反代，
    # 鉴权在后端 `require_admin`（这是接口文档的唯一入口）。
    location ~ ^/(docs|redoc|openapi\.json)($|/) {
        return 404;
    }
}
