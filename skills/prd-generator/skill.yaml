# prd-generator 技能包元数据
# 与 SKILL.md 的 frontmatter 保持一致；SKILL.md 负责执行流程，本文件负责声明式描述。

name: prd-generator
version: 0.1.0
description: >-
  把问卷答案、对话澄清结果或零散需求描述整理成结构化 PRD（六章节 Markdown），
  并可选输出质量检查报告。适用于需求文档生成、PRD 评审与需求输入字段校验。

# 本技能包服务于哪些生成产物。取值与后端任务类型 `kind` 一致（prd / api_docs / prompts）。
# 生成管线按这个字段自动找到自己该用的技能包，**所以新增一个技能包只需要加一个目录**——
# 不必回头改 Python（见 `services/skill_registry.py`）。
applies_to:
  - prd

entry: SKILL.md
agent_created: true

tags:
  - prd
  - product
  - documentation
  - requirements

# 输入：需求结构化字段，契约定义见 references/field-schema.json
inputs:
  required:
    - product_name
    - product_goal
    - target_users
    - platform
  optional:
    - mvp_features
    - v2_features
    - ui_pages
    - technical_constraints

# 输出产物
outputs:
  - path: "{{output_dir}}/{{product_name}}-PRD.md"
    description: PRD 正文，六章节结构，依据 references/prd-template.md 渲染。
  - path: "{{output_dir}}/{{product_name}}-PRD-review.md"
    description: 质量检查报告，依据 assets/review-report.md 渲染，可选输出。

# 生成管线需要注入的资源。`key` 是程序取用时的语义键（必填，改它等于改契约）；
# `purpose` / `load_at` 是给人读的说明。**列在这里的每一项都视为必需**：
# 缺任何一个都意味着技能包不完整，生成会退回内置提示词，并在启动自检、
# `/health` 与本次生成的回执上如实报出来，不会静默发生。
references:
  - key: field_schema
    path: references/field-schema.json
    purpose: 输入字段契约、字段别名映射、归一化规则。
    load_at: [validate-input, normalize-requirements]
  - key: prd_template
    path: references/prd-template.md
    purpose: PRD 六章节正文骨架与渲染说明。
    load_at: [render-sections]
  - key: writing_rules
    path: references/writing-rules.md
    purpose: 写作规范（结构化表达、内容去重、事实与建议区分、缺失信息处理、禁止编造）与自检清单。
    load_at: [render-sections, quality-check]

assets:
  - path: assets/review-report.md
    purpose: 质量检查报告模板，仅在需要输出评审报告时使用。
    load_at: [quality-check]

# 工作流阶段，与 SKILL.md 的四个阶段一一对应
workflow:
  - id: validate-input
    description: 校验输入字段是否齐全、类型是否合规；必填缺失时先向用户提问。
  - id: normalize-requirements
    description: 按 field-schema.json 的别名表与归一化规则统一字段结构，只改名不补内容。
  - id: render-sections
    description: 按 prd-template.md 渲染六个章节，遵循 writing-rules.md。
  - id: quality-check
    description: 按自检清单核对，必要时用 assets/review-report.md 输出检查报告。
