        ># 社区二手交易 App 产品需求文档（PRD）

## 1. 产品概述
让同一小区的邻居之间安全、快速地转让闲置物品。
目标用户：25–40 岁城市社区住户。
平台：iOS / Android App + 微信小程序。

## 2. 功能范围（MVP）
- 发布闲置：图片、标题、价格、成色。
- 附近在售列表：按小区与距离排序。
- 站内私信：全程不暴露手机号。
- 交易评价：成交后双向评价。
- 举报与拉黑：举报进入人工审核队列。
- 认证：手机号 + 短信验证码。</textarea>

## 1. 认证
POST /api/auth/sms-code
POST /api/auth/login

## 2. 闲置物品
GET /api/items?lat=&lng=&radius=3&category=
POST /api/items
GET /api/items/{item_id}
PATCH /api/items/{item_id}/status

## 3. 私信
POST /api/items/{item_id}/threads</textarea>
