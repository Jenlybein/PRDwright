[project]
name = "backend"
version = "0.1.0"
description = "PRDwright 后端服务"
requires-python = ">=3.12"
dependencies = [
    "arkruntime>=0.8.0",
    "fastapi[standard]>=0.142.2",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.6.7",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试用 SQLite 文件库，每个用例走 tmp_path 隔离，故不需要额外插件


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
