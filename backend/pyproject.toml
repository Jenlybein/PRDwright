[project]
name = "backend"
version = "0.1.0"
description = "PRDwright 后端服务"
requires-python = ">=3.12"
dependencies = [
    "arkruntime>=0.8.0",
    # 主密钥加密（Fernet）。原本作为 langchain 的传递依赖已装，这里显式声明：
    # `core/crypto.py` 直接 import 它，不能把「能不能起服务」押在别人的依赖树上。
    "cryptography>=42.0.0",
    "fastapi[standard]>=0.142.2",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    # 三家「协议与 OpenAI 不同」的供应商。刻意**不做 optional-dependencies 分组**：
    # 后台的供应商页要能列出全部可选协议，装了才显示、没装就灰掉会让「能不能用」
    # 依赖部署命令，排查时多一个变量。代价是两个重依赖（protobuf / tokenizers），
    # 所以装完必须立刻跑一次全量用例确认没把别的包带崩。
    "langchain-google-genai>=2.2.0",
    "langchain-huggingface>=1.2.0",
    "langchain-nvidia-ai-endpoints>=1.1.0",
    "langchain-openai>=1.6.7",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试用 SQLite 文件库，每个用例走 tmp_path 隔离，故不需要额外插件


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
