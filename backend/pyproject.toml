[project]
name = "backend"
version = "0.1.0"
description = "PRDwright 后端服务"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "arkruntime>=0.8.0",
    # 主密钥加密（Fernet）。原本作为 langchain 的传递依赖已装，这里显式声明：
    # `core/crypto.py` 直接 import 它，不能把「能不能起服务」押在别人的依赖树上。
    "cryptography>=42.0.0",
    "fastapi[standard]>=0.142.2",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    # 三家「协议与 OpenAI 不同」的供应商。刻意**不做 optional-dependencies 分组**：
    # 后台的供应商页要能列出全部可选协议，装了才显示、没装就灰掉会让「能不能用」
    # 依赖部署命令，排查时多一个变量。代价是两个重依赖（protobuf / tokenizers），
    # 所以装完必须立刻跑一次全量用例确认没把别的包带崩。
    "langchain-google-genai>=2.2.0",
    "langchain-huggingface>=1.2.0",
    "langchain-nvidia-ai-endpoints>=1.1.0",
    "langchain-openai>=1.6.7",
    # 唯一的数据库驱动（v9 单后端 #78）：Postgres 走 psycopg 3。MySQL 的 pymysql 已删除。
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    # 数据层（v6）。三个包的分工：
    # - sqlmodel：表模型（同时是 Pydantic 模型），结构真源只有一份；
    # - sqlalchemy：Engine / Session / 连接池 / 事务，取代 444 行自建池；
    # - alembic：迁移链，取代 `PRAGMA user_version` 的 20 步手写清单。
    "sqlalchemy>=2.0.36",
    "sqlmodel>=0.0.31",
]

# 这里**故意不再声明 `[project.scripts]`**。
#
# 曾经有一条 `backend = "backend.main:app"`：它能把属性解析出来（模块 `backend.main` 的
# `app` 确实存在），但 console script 会把它**零参调用**，而 FastAPI 对象的
# `__call__(scope, receive, send)` 要的是服务器递来的三个参数 —— 真敲 `uv run backend`
# 立刻 `TypeError`。它指向的是「web 应用」，不是「可执行命令」；要跑就用服务器：
# `uvicorn backend.main:app`（README / 部署 / CI 一直走这一条）。
#
# 删掉而不是包一层 `serve()`：全仓零使用者，多一条命令就多一种「怎么启动」的说法。
# 守卫见 `tests/test_entrypoint.py`——它同时钉住「别把 ASGI 应用声明成命令」。

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 每个用例一个**独立的 Postgres 库**（每 worker 建一次模板库，每用例
# `CREATE DATABASE … TEMPLATE` 派生一个，用完删掉，见 `tests/conftest.py`），
# 库名带进程内唯一后缀，所以可以安全地按进程并行。
#
# 前提：需要一个**集成库**，地址来自 `PRDWRIGHT_TEST_POSTGRES_URL`
# （⚠️ 维护库地址、不带库名，缺省 `postgresql+psycopg://postgres:postgres@127.0.0.1:5433`）。
# 连不上时用例**直接失败**并给出操作指引——不再静默跳过。
#
# 为什么默认并行：全量千余例单进程要数分钟，等于没人会随手跑；
# 并行后多核机器显著变快、CI 的少核机器自动降路数。
# 并行不改变用例集合与结果；现行收集数按 `uv run pytest --collect-only -q` 现取，
# 别把注释里的历史数字当基线（见 docs/agents/conventions.md §10）。
#
# 单文件调试时加 `-n0` 关掉并行：Windows 上并行启动固定多花约 4.5 秒，
# 只跑十几个用例时那笔开销比省下的时间还多。
addopts = "-n auto"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]
