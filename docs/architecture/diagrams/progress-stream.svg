<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stream-title stream-desc">
  <title id="stream-title">进度如何从执行进程抵达浏览器</title>
  <desc id="stream-desc">执行进程把合并后的增量追加到 job_events 表；浏览器按游标从表中读取；另有一条虚线通知，只用于唤醒读者立刻去读。</desc>
  <defs>
    <pattern id="stream-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
    <marker id="stream-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="stream-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#stream-dots)" opacity="0.55"/>

  <!-- 先画三条连接 -->
  <line x1="252" y1="222" x2="372" y2="222" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#stream-arrow)"/>
  <line x1="624" y1="236" x2="744" y2="236" stroke="#bf4520" stroke-width="1.4" marker-end="url(#stream-arrow-accent)"/>
  <path d="M148 178 V104 Q148,96 156,96 H804 Q812,96 812,104 V170" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#stream-arrow)"/>

  <!-- 标签与底衬 -->
  <g font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" text-anchor="middle" letter-spacing="0.04em" fill="#4f5d75">
    <rect x="268" y="204" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="304" y="214">追加一行</text>
    <rect x="640" y="218" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="684" y="228" fill="#bf4520">从游标往后读</text>
    <rect x="424" y="78" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="88">通知：有新行了</text>
  </g>

  <g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',system-ui,sans-serif">
    <!-- 执行进程 -->
    <rect x="48" y="178" width="200" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="48" y="178" width="200" height="88" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
    <text x="148" y="212" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle">执行中的进程</text>
    <text x="148" y="232" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" text-anchor="middle">可能在任意一台</text>
    <text x="148" y="248" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" text-anchor="middle">按 300ms / 4KB 合并</text>

    <!-- 事件表（焦点） -->
    <rect x="380" y="150" width="240" height="160" rx="6" fill="#f5f5f5"/>
    <rect x="380" y="150" width="240" height="160" rx="6" fill="#ffffff" stroke="#bf4520"/>
    <text x="500" y="174" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">事件表 job_events</text>
    <line x1="392" y1="184" x2="608" y2="184" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
    <g font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#4f5d75">
      <text x="396" y="203">101</text><text x="430" y="203">阶段</text>
      <text x="396" y="225">102</text><text x="430" y="225">正文增量</text>
      <text x="396" y="247">103</text><text x="430" y="247">正文增量</text>
      <text x="396" y="269">104</text><text x="430" y="269">章节定稿</text>
    </g>
    <text x="500" y="292" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" text-anchor="middle">只增不改 · 保留 7 天</text>

    <!-- 浏览器 -->
    <rect x="752" y="178" width="164" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="752" y="178" width="164" height="88" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
    <text x="834" y="212" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle">浏览器</text>
    <text x="834" y="232" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" text-anchor="middle">每个读者各自记游标</text>
    <text x="834" y="248" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" text-anchor="middle">断线接着读，不丢不重</text>
  </g>
</svg>
