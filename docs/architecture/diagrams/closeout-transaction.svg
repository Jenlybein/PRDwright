<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="txn-title txn-desc">
  <title id="txn-title">一次成功收尾的五个动作同属一个事务</title>
  <desc id="txn-desc">一个事务框内依次是改任务终态、记一条成功账本、写正文新版本、写审核结论、清空租约；任一步失败则整批回滚。</desc>
  <defs>
    <pattern id="txn-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
    <marker id="txn-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#txn-dots)" opacity="0.55"/>

  <rect x="48" y="64" width="864" height="392" rx="8" fill="rgba(79,93,117,0.03)" stroke="rgba(45,49,66,0.14)"/>
  <text x="68" y="88" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" letter-spacing="0.14em">同一个事务：要么全成，要么全不成</text>

  <!-- 四段序列箭头，先画 -->
  <g stroke="#4f5d75" stroke-width="1.2">
    <line x1="436" y1="160" x2="436" y2="170" marker-end="url(#txn-arrow)"/>
    <line x1="436" y1="232" x2="436" y2="242" marker-end="url(#txn-arrow)"/>
    <line x1="436" y1="304" x2="436" y2="314" marker-end="url(#txn-arrow)"/>
    <line x1="436" y1="376" x2="436" y2="386" marker-end="url(#txn-arrow)"/>
  </g>

  <g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',system-ui,sans-serif">
    <!-- ① -->
    <rect x="96" y="104" width="680" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
    <rect x="108" y="112" width="16" height="14" rx="2" fill="rgba(45,49,66,0.12)"/>
    <text x="116" y="123" fill="#2d3142" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" text-anchor="middle">1</text>
    <text x="140" y="126" fill="#2d3142" font-size="15" font-weight="600">改任务状态</text>
    <text x="140" y="146" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">条件更新：状态 + 本轮凭证 + 未过期，改到 1 行才算成</text>

    <!-- ② -->
    <rect x="96" y="176" width="680" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
    <rect x="108" y="184" width="16" height="14" rx="2" fill="rgba(45,49,66,0.12)"/>
    <text x="116" y="195" fill="#2d3142" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" text-anchor="middle">2</text>
    <text x="140" y="198" fill="#2d3142" font-size="15" font-weight="600">记一条成功账本</text>
    <text x="140" y="218" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">第几次尝试、花了多少、跑了多久</text>

    <!-- ③ 焦点：写正文 -->
    <rect x="96" y="248" width="680" height="56" rx="6" fill="#ffffff" stroke="#bf4520"/>
    <rect x="108" y="256" width="16" height="14" rx="2" fill="rgba(191,69,32,0.20)"/>
    <text x="116" y="267" fill="#bf4520" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" text-anchor="middle">3</text>
    <text x="140" y="270" fill="#2d3142" font-size="15" font-weight="600">写正文新版本</text>
    <text x="140" y="290" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">带版本号乐观锁：我以为当前是第几版，对不上就整批失败</text>

    <!-- ④ -->
    <rect x="96" y="320" width="680" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
    <rect x="108" y="328" width="16" height="14" rx="2" fill="rgba(45,49,66,0.12)"/>
    <text x="116" y="339" fill="#2d3142" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" text-anchor="middle">4</text>
    <text x="140" y="342" fill="#2d3142" font-size="15" font-weight="600">写审核结论</text>
    <text x="140" y="362" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">结论与它描述的那一版正文同批落库</text>

    <!-- ⑤ -->
    <rect x="96" y="392" width="680" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
    <rect x="108" y="400" width="16" height="14" rx="2" fill="rgba(45,49,66,0.12)"/>
    <text x="116" y="411" fill="#2d3142" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" text-anchor="middle">5</text>
    <text x="140" y="414" fill="#2d3142" font-size="15" font-weight="600">清空租约</text>
    <text x="140" y="434" fill="#4f5d75" font-size="10" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">清空本身就是让旧凭证失效的手段</text>
  </g>

  <g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',system-ui,sans-serif">
    <text x="48" y="488" fill="#4f5d75" font-size="10">任一步失败 → 整批回滚 → 任务仍停在「执行中」，由租约恢复接手；绝不会出现「宣布成功但正文没写」。</text>
  </g>
</svg>
